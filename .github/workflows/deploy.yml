name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DB_USER: test_user
      DB_PASSWORD: test_pass
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: test_db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy to server
    needs: validate
    runs-on: self-hosted
    steps:
      - name: Pull latest changes
        working-directory: /home/mastero/FullStack- ESP8266_BME280
        run: git pull origin main

      - name: Install backend dependencies
        working-directory: /home/mastero/FullStack- ESP8266_BME280/backend
        run: npm install --omit=dev

      # El runner self-hosted mata al final del job cualquier proceso que siga
      # siendo descendiente del arbol de procesos del job (lo detecta por PPID,
      # incluso si el proceso hizo setsid). systemd-run sin --scope le pide a
      # systemd (PID 1) que forkee el proceso el mismo via D-Bus, asi que nace
      # fuera del arbol del job desde el inicio y sobrevive a la limpieza.
      # --wait hace que este step siga fallando visiblemente si pm2 restart falla.
      # --setenv=HOME=/root es obligatorio: sin HOME, PM2 no encuentra el daemon
      # real (/root/.pm2) y crea uno nuevo y vacio en /etc/.pm2 que no conoce
      # bme280-station ("Process or Namespace bme280-station not found").
      - name: Restart service (PM2)
        run: systemd-run --quiet --wait --collect --setenv=HOME=/root pm2 restart bme280-station

      # Si el restart deja el backend caido o respondiendo 500, este step falla
      # visiblemente en vez de que el job quede en verde con el backend roto.
      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:7755/api/readings/latest || echo "000")
            if [ "$code" = "200" ]; then
              echo "Smoke test OK (HTTP $code, intento $i)"
              exit 0
            fi
            echo "Intento $i: HTTP $code, reintentando en 2s..."
            sleep 2
          done
          echo "Smoke test FALLO: el backend no respondio 200 tras el restart"
          exit 1
